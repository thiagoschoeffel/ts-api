name: ts-api

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__Database: Host=postgres;Port=5432;Database=${POSTGRES_DB:-ts_api};Username=${POSTGRES_USER:-ts_api};Password=${POSTGRES_PASSWORD:-change-me}
      Authentication__Authority: http://localhost:${IDENTITY_PORT:-8081}/realms/sabor-sante
      Authentication__MetadataAddress: http://identity:8080/realms/sabor-sante/.well-known/openid-configuration
      Authentication__Audience: ts-api
      Authentication__RequireHttpsMetadata: "false"
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      identity:
        condition: service_healthy
  identity:
    image: quay.io/keycloak/keycloak:26.7.3
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-change-me}
    ports:
      - "127.0.0.1:${IDENTITY_PORT:-8081}:8080"
    volumes:
      - ./identity:/opt/keycloak/data/import:ro
      - keycloak-data:/opt/keycloak/data
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080; printf 'GET /realms/sabor-sante HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; grep -q '200 OK' <&3"]
      interval: 5s
      timeout: 3s
      retries: 20
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ts_api}
      POSTGRES_USER: ${POSTGRES_USER:-ts_api}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ts_api} -d ${POSTGRES_DB:-ts_api}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
  keycloak-data:
