name: ts-api

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__Database: Host=postgres;Port=5432;Database=${POSTGRES_DB:-ts_api};Username=${POSTGRES_USER:-ts_api};Password=${POSTGRES_PASSWORD:-change-me}
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ts_api}
      POSTGRES_USER: ${POSTGRES_USER:-ts_api}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ts_api} -d ${POSTGRES_DB:-ts_api}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
